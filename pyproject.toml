[project]
name = "awesome-llm-tech-reports"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<8"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3,<4"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff==0.15.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["scripts/report_*.py", "scripts/parse_readme.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
