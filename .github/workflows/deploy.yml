name: Deploy GitHub Pages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate catalog and generated files
        run: python3 scripts/report_catalog.py check

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install artifact readiness dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/actions/wait-pages-artifact

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs/'
          # A rerun must not collide with artifacts from earlier attempts.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for uploaded artifact visibility
        uses: ./.github/actions/wait-pages-artifact
        timeout-minutes: 2
        with:
          artifact-name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          artifact-id: ${{ steps.upload.outputs.artifact_id }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
