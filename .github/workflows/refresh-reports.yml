name: Refresh model technical reports

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, publish]
        default: preview
      since:
        description: Start date for a replay (YYYY-MM-DD)
        type: string
      vendor:
        description: Vendor slug, or leave blank for all
        type: string
  pull_request:
    paths:
      - .github/workflows/refresh-reports.yml
      - .github/workflows/deploy.yml
      - scripts/**
      - configs/**
      - tests/**
      - data/catalog.json
      - docs/**
      - assets/diagrams/**
      - README.md
      - pyproject.toml
      - Makefile

permissions:
  contents: read

concurrency:
  group: reports-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule' || vars.REPORTS_AUTO_REFRESH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: make check

  refresh:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.REPORTS_AUTO_REFRESH == 'true'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      published_ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv sync --extra postgres
      - name: Collect and resolve reports
        env:
          MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          SINCE: ${{ inputs.since }}
          VENDOR: ${{ inputs.vendor }}
          REPORTS_DATABASE_URL: ${{ (github.event_name == 'schedule' || inputs.mode == 'publish') && secrets.REPORTS_DATABASE_URL || '' }}
        run: |
          args=()
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ -n "$VENDOR" ]; then args+=(--vendor "$VENDOR"); fi
          if [ "$MODE" = publish ]; then args+=(--publish); fi
          uv run --no-sync python scripts/report_watch.py "${args[@]}"
      - name: Publish verified changes
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        id: publish
        run: |
          uv run --no-sync python scripts/report_catalog.py check
          git add -- README.md data/catalog.json assets/diagrams docs/data/models.json docs/data/word-cloud.json docs/timeline.html ':(glob)20*/**/*.pdf' ':(glob)pdf/*.pdf'
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh model technical reports'
          git push
          printf 'ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.published_ref != ''
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.published_ref }}
    permissions:
      contents: read
      pages: write
      id-token: write
