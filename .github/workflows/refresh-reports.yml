name: Refresh model technical reports

on:
  schedule:
    - cron: "23 */8 * * *"
  push:
    branches: [main]
    paths:
      - configs/**
      - scripts/report_*.py
      - scripts/parse_readme.py
      - docs/index.html
      - docs/js/**
      - docs/css/**
      - docs/assets/**
      - docs/data/**
      - data/catalog.json
      - data/report-text-terms.json
      - .github/workflows/refresh-reports.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, publish]
        default: preview
      since:
        description: Start date for a replay (YYYY-MM-DD)
        type: string
      vendor:
        description: Vendor slug, or leave blank for all
        type: string
      word_cloud_only:
        description: Read the existing catalog sources and refresh the word cloud
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/refresh-reports.yml
      - .github/workflows/deploy.yml
      - scripts/**
      - configs/**
      - tests/**
      - data/catalog.json
      - data/report-text-terms.json
      - docs/**
      - assets/diagrams/**
      - README.md
      - pyproject.toml
      - Makefile

permissions:
  contents: read

concurrency:
  group: reports-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule' || vars.REPORTS_AUTO_REFRESH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - if: github.event_name == 'push'
        run: uv run python scripts/report_catalog.py build
      - run: make check

  refresh:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
       ((github.event_name == 'schedule' || github.event_name == 'push') && vars.REPORTS_AUTO_REFRESH == 'true'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      published_ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --extra postgres
      - name: Collect and resolve reports
        if: github.event_name != 'workflow_dispatch' || !inputs.word_cloud_only
        env:
          MODE: ${{ github.event_name != 'workflow_dispatch' && 'publish' || inputs.mode }}
          SINCE: ${{ github.event_name == 'push' && '2026-07-01' || inputs.since }}
          BACKFILL_ONLY: ${{ github.event_name == 'push' }}
          VENDOR: ${{ inputs.vendor }}
          REPORTS_DATABASE_URL: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode == 'publish') && secrets.REPORTS_DATABASE_URL || '' }}
        run: |
          args=()
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ -n "$VENDOR" ]; then args+=(--vendor "$VENDOR"); fi
          if [ "$MODE" = publish ]; then args+=(--publish); fi
          if [ "$BACKFILL_ONLY" = true ]; then args+=(--backfill-only); fi
          uv run --no-sync python scripts/report_watch.py "${args[@]}"
      - name: Read source text for the word cloud
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish' || inputs.word_cloud_only
        timeout-minutes: 6
        continue-on-error: true
        env:
          WORD_CLOUD_ONLY: ${{ inputs.word_cloud_only }}
        run: |
          limit=30
          if [ "$WORD_CLOUD_ONLY" = true ]; then limit=250; fi
          uv run --no-sync python scripts/report_wordcloud.py --limit "$limit"
      - name: Publish verified changes
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        id: publish
        run: |
          uv run --no-sync python scripts/report_catalog.py build
          uv run --no-sync python scripts/report_catalog.py check
          git add -- README.md data assets/diagrams docs/data/models.json docs/data/word-cloud.json docs/timeline.html docs/assets/diagrams/technical-word-cloud.svg ':(glob)20*/**/*.pdf' ':(glob)pdf/*.pdf'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Refresh model technical reports'
            git push
          fi
          printf 'ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.published_ref != ''
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.published_ref }}
    permissions:
      contents: read
      pages: write
      id-token: write
